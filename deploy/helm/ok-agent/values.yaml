# ok's deploy agent (docs/hosted.md, "Deploy agents, as built"; docs/deploy.md, "Deploy agents"): it
# runs as one of its organization's robots, the one the organization designated its deploy agent,
# and connects out to ok — nothing connects in.

image:
  repository: ghcr.io/cidan/ok-runner   # ok, with bazelisk for migrations
  tag: ""                               # the chart's appVersion unless set
  pullPolicy: IfNotPresent

# Where ok is reached: its public address, host:port.
address: ""
# The CA ok's certificate is signed by, when not one the system trusts: a ConfigMap's key.
caConfigMap: {name: "", key: ca.crt}

# How its robot proves itself. A token: the cluster's ServiceAccount token, its audience the
# organization's ID (ok identity's ListIssuers says it), from an issuer the organization trusts,
# its subject — system:serviceaccount:<namespace>:<release>-agent — bound to the robot. Or a
# credential: a Secret holding a key and certificate an owner certified for the robot.
organizationID: ""
credentialSecret: ""

# The namespaces whose Deployments and StatefulSets ok rolls: each grants the agent what rolling
# needs, and nothing more (docs/deploy.md, "Grants").
namespaces: []

# Migrations, run here with the agent's own environment — where they find their databases — from
# commits on main of the organization's repositories, which the robot must be granted read on.
migrations:
  enabled: true
  # The environment migrations run with: name to a Secret's key.
  env: {}
  #   APP_DATABASE_URL: {secret: shop-db, key: url}
  # okfs presents each migration's commit — Bazel reads what it builds, nothing is written out —
  # in a user namespace of the agent's own, with /dev/fuse: as the chart's device plugin offers it
  # (devicePlugin), or as one of your own does, its resource named here. Without either, /dev/fuse
  # is bound in from the node, which works only where the runtime applies no device allowlist.
  fuseResource: ""
  storage: 20Gi                 # okfs's caches and Bazel's output base

# /dev/fuse as a resource a pod requests, offered by generic-device-plugin on every node as
# <domain>/fuse (docs/install.md, "Workers' nodes"). Disable it where the cluster runs a device
# plugin offering it already — ok's own chart's, say — and name its resource in
# migrations.fuseResource.
devicePlugin:
  enabled: true
  image: squat/generic-device-plugin@sha256:5c48f7a16cfb37c4e07731bfa384b9dba6e12d2b0fb4350d8a321d49f12ac494
  domain: devic.es
  count: 16                     # pods on a node that may hold the device at once
  nodeSelector: {}
  tolerations:
    - {operator: Exists, effect: NoSchedule}
    - {operator: Exists, effect: NoExecute}

resources:
  requests: {cpu: 250m, memory: 512Mi}
  limits: {memory: 4Gi}

securityContext:
  runAsNonRoot: true
  runAsUser: 10001
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities: {drop: [ALL]}
