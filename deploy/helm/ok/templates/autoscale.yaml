{{- if and .Values.worker.enabled .Values.worker.autoscale.enabled }}
# ok automation, in the server, sizes the workers' Deployment through its scale subresource, and
# marks its pods' deletion cost so a shrink takes the idlest (docs/hosted.md, "Hosted automation,
# as built").
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "ok.name" . }}-autoscale
  labels: {{- include "ok.labels" . | nindent 4 }}
rules:
  - apiGroups: [apps]
    resources: [deployments, deployments/scale]
    resourceNames: [{{ include "ok.name" . }}-worker]
    verbs: [get, update]
  - apiGroups: [""]
    resources: [pods]
    verbs: [list, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "ok.name" . }}-autoscale
  labels: {{- include "ok.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "ok.name" . }}-autoscale
subjects:
  - kind: ServiceAccount
    name: {{ include "ok.name" . }}-server
    namespace: {{ .Release.Namespace }}
{{- end }}
