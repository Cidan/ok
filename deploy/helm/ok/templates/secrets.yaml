{{- if .Values.secrets.enabled }}
# ok secrets (docs/secrets.md), as the robot secrets.ok, in a Deployment of its own: it holds every
# repository's secrets, sealed under keys of each repository's own, wrapped by its root — a
# keyring Secret mounted as a file, or a key management service its ServiceAccount reaches by
# workload identity (secrets.serviceAccountAnnotations).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "ok.name" . }}-secrets
  labels: {{- include "ok.labels" . | nindent 4 }}
  {{- with .Values.secrets.serviceAccountAnnotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ok.name" . }}-secrets
  labels: {{- include "ok.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: secrets
  ports:
    - {name: http, port: 8472, targetPort: http, appProtocol: kubernetes.io/h2c}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ok.name" . }}-secrets
  labels: {{- include "ok.labels" . | nindent 4 }}
    app.kubernetes.io/component: secrets
spec:
  replicas: {{ .Values.secrets.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: secrets
  template:
    metadata:
      labels: {{- include "ok.labels" . | nindent 8 }}
        app.kubernetes.io/component: secrets
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "ok.name" . }}-secrets
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: secrets
          image: {{ include "ok.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: [secrets, serve, -config, /etc/ok/config/ok.yaml]
          ports:
            - {name: http, containerPort: 8472}
            - {name: metrics, containerPort: 8473}
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 20
            failureThreshold: 6
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          {{- with .Values.secrets.resources }}
          resources: {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            {{- include "ok.configMounts" . | nindent 12 }}
            {{- if .Values.secrets.databaseSecret.name }}
            - {name: secrets-database, mountPath: /etc/ok/secrets/secrets-database, readOnly: true}
            {{- else }}
            {{- include "ok.databaseMounts" . | nindent 12 }}
            {{- end }}
            - {name: ok-token, mountPath: /var/run/secrets/ok, readOnly: true}
            {{- if not .Values.secrets.root }}
            - {name: keyring, mountPath: /etc/ok/keyring, readOnly: true}
            {{- end }}
      volumes:
        {{- include "ok.configVolumes" . | nindent 8 }}
        {{- if .Values.secrets.databaseSecret.name }}
        - name: secrets-database
          secret:
            secretName: {{ .Values.secrets.databaseSecret.name }}
            items: [{key: {{ .Values.secrets.databaseSecret.key }}, path: url}]
        {{- else }}
        {{- include "ok.databaseVolumes" . | nindent 8 }}
        {{- end }}
        {{- include "ok.tokenVolume" . | nindent 8 }}
        {{- if not .Values.secrets.root }}
        - name: keyring
          secret:
            secretName: {{ required "secrets.keyringSecret.name names the Secret holding the keyring (ok secrets keyring -id ID), or secrets.root a key management service's key" .Values.secrets.keyringSecret.name }}
            items: [{key: {{ .Values.secrets.keyringSecret.key }}, path: keyring}]
            defaultMode: 0400
        {{- end }}
      {{- with .Values.secrets.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.secrets.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.secrets.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
