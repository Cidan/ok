{{- if .Values.ingress.enabled }}
# ok's one public address: every path to the server, which runs identity (/id/…), the SCM, and
# control. gRPC needs HTTP/2 to the backend: set your controller's annotation for it.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "ok.name" . }}
  labels: {{- include "ok.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls: {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          {{- if .Values.secrets.enabled }}
          # People's secrets service goes to ok secrets, which runs apart.
          - path: /ok.secrets.v1.Secrets
            pathType: Prefix
            backend:
              service:
                name: {{ include "ok.name" . }}-secrets
                port: {name: http}
          {{- end }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "ok.name" . }}-server
                port: {name: http}
{{- end }}
