{{- if .Values.devicePlugin.enabled }}
# The devices workers and the deployer open, offered as resources a pod requests — a container
# runtime lets a pod open a device only as a device plugin offers it: /dev/fuse, which okfs mounts
# their checkouts with, and /dev/kvm, which runs in microVMs need. generic-device-plugin, on every
# node (docs/install.md, "Workers' nodes").
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "ok.name" . }}-devices
  labels: {{- include "ok.labels" . | nindent 4 }}
    app.kubernetes.io/component: devices
spec:
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: devices
  updateStrategy: {type: RollingUpdate}
  template:
    metadata:
      labels: {{- include "ok.labels" . | nindent 8 }}
        app.kubernetes.io/component: devices
    spec:
      {{- with .Values.devicePlugin.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.devicePlugin.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: devices
          image: {{ .Values.devicePlugin.image }}
          args:
            - --domain
            - {{ .Values.devicePlugin.domain | quote }}
            # Each device is offered count times a node: as many pods there may hold it at once.
            - --device
            - '{"name": "fuse", "groups": [{"count": {{ .Values.devicePlugin.count }}, "paths": [{"path": "/dev/fuse"}]}]}'
            # A node without /dev/kvm offers none, so a microVM worker is never placed on it.
            - --device
            - '{"name": "kvm", "groups": [{"count": {{ .Values.devicePlugin.count }}, "paths": [{"path": "/dev/kvm"}]}]}'
          ports:
            - {name: metrics, containerPort: 8080}
          resources:
            requests: {cpu: 50m, memory: 16Mi}
            limits: {memory: 64Mi}
          # It registers with the kubelet and hands it the node's devices: both need the host.
          securityContext: {privileged: true}
          volumeMounts:
            - {name: plugins, mountPath: /var/lib/kubelet/device-plugins}
            - {name: dev, mountPath: /dev}
      volumes:
        - name: plugins
          hostPath: {path: /var/lib/kubelet/device-plugins}
        - name: dev
          hostPath: {path: /dev}
{{- end }}
