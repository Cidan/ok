# ok serve: identity, the SCM, automation, and control — the roles the chart's server.roles names —
# in one Deployment, on one port. Identity in the process certifies the other roles' keys; its own
# ServiceAccount token reads the cluster's token keys (/openid/v1/jwks), which every ServiceAccount
# may, to check the workers' and the deployer's tokens.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "ok.name" . }}-server
  labels: {{- include "ok.labels" . | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ok.name" . }}-server
  labels: {{- include "ok.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: server
  ports:
    - {name: http, port: {{ .Values.service.port }}, targetPort: http, appProtocol: kubernetes.io/h2c}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ok.name" . }}-server
  labels: {{- include "ok.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  replicas: {{ .Values.server.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: server
  template:
    metadata:
      labels: {{- include "ok.labels" . | nindent 8 }}
        app.kubernetes.io/component: server
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "ok.name" . }}-server
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: ok
          image: {{ include "ok.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: [serve, -config, /etc/ok/config/ok.yaml, -roles, {{ join "," .Values.server.roles | quote }}]
          ports:
            - {name: http, containerPort: 8472}
            - {name: metrics, containerPort: 8473}
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 20
            failureThreshold: 6
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          {{- with .Values.server.resources }}
          resources: {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            {{- include "ok.configMounts" . | nindent 12 }}
            - {name: ca, mountPath: /etc/ok/ca, readOnly: true}
            {{- range .Values.server.extraSecretMounts }}
            - {name: {{ .name }}, mountPath: {{ .mountPath }}, readOnly: true}
            {{- end }}
      volumes:
        {{- include "ok.configVolumes" . | nindent 8 }}
        - name: ca
          secret: {secretName: {{ .Values.identity.caSecret }}}
        {{- range .Values.server.extraSecretMounts }}
        - name: {{ .name }}
          secret: {secretName: {{ .secretName }}}
        {{- end }}
      {{- with .Values.server.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.server.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.server.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
