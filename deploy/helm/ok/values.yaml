# ok's chart. Everything ok reads is one configuration file, ok.yaml, which this chart renders
# from these values (docs/configuration.md); `config` passes through what is your installation's
# to choose — sign-in, the system of record, the buckets — as ok.yaml writes it.

image:
  repository: ghcr.io/cidan/ok
  tag: ""                       # the chart's appVersion unless set
  pullPolicy: IfNotPresent
# The image for workers and the deployer: ok, ok's jj, bazelisk, bubblewrap, and FUSE.
runnerImage:
  repository: ghcr.io/cidan/ok-runner
  tag: ""
imagePullSecrets: []

domain: example.com             # every name is under it: ada.human.example.com
installation: ok                # what the pages call it
publicURL: https://ok.example.com

# The PostgreSQL every role keeps its tables in: a Secret holding its URL, with its password.
database:
  urlSecret: {name: ok-database, key: url}
  maxConnections: 20
  # Spanner instead (projects/P/instances/I): each role's database there, made when it first
  # starts, reached as the roles' workload identity (server.serviceAccountAnnotations, and the
  # deployer's deploy.serviceAccountAnnotations); no URL.
  spanner: {instance: "", prefix: ok}

identity:
  # The identity CA (ok identity ca init -dir DIR): a Secret holding tls.crt and tls.key.
  caSecret: ok-identity-ca
  bootstrapAdmins: []           # handles who administer until a tree declares admins.acl
  treeRepository: ""            # the repository whose groups-and-ACLs tree is ok's
  # The cluster's ServiceAccount token issuer, by which workers and the deployer prove themselves
  # (kubectl get --raw /.well-known/openid-configuration | jq -r .issuer).
  kubernetesIssuer: https://kubernetes.default.svc.cluster.local
  extraFederation: []           # more issuers, as identity.federation writes them (a CI's)
  extraRobots: []               # more robots, as identity.robots writes them

# Passed through into ok.yaml, merged over what the chart renders: identity's sign_in,
# system_of_record, session, and trusted_header; scm.objects and its other keys; automation.logs;
# tls. Secret files they name are mounted with server.extraSecretMounts.
config: {}

# ok serve: the roles in one Deployment.
server:
  roles: [identity, scm, automation, control]
  replicas: 1
  # Its ServiceAccount's annotations: a cloud's workload identity, say
  # (iam.gke.io/gcp-service-account), by which it reaches Spanner and a bucket with no key.
  serviceAccountAnnotations: {}
  resources: {}
  # Where the SCM spools what a publish uploads and a garbage collection compacts: an emptyDir, as
  # large as the largest push and the largest repository's packs.
  tmp: {sizeLimit: 20Gi}
  extraSecretMounts: []         # [{name, secretName, mountPath}]
  nodeSelector: {}
  tolerations: []
  affinity: {}

service:
  type: ClusterIP
  port: 8472

# ok's public address through the Gateway API (docs/install.md): an HTTPRoute to the server, on
# the Gateway parentRefs names, for publicURL's host unless hostnames says otherwise. TLS is the
# Gateway's listener's.
httpRoute:
  enabled: false
  parentRefs: []                # [{name, namespace, sectionName}]
  hostnames: []
  annotations: {}

# Or through an Ingress: your controller must speak HTTP/2 to the backend, for gRPC — set its
# annotation for it.
ingress:
  enabled: false
  className: ""
  annotations: {}
  host: ok.example.com
  tls: []                       # [{secretName, hosts}]

# The devices workers and the deployer open, as resources a pod requests: /dev/fuse (okfs) and
# /dev/kvm (runs in microVMs), offered by generic-device-plugin on every node, as
# <domain>/fuse and <domain>/kvm (docs/install.md, "Workers' nodes"). Disable it where the cluster
# runs a device plugin offering them already, and name its resources in worker.fuseResource,
# worker.microvm.kvmResource, and deploy.fuseResource.
devicePlugin:
  enabled: true
  image: squat/generic-device-plugin@sha256:5c48f7a16cfb37c4e07731bfa384b9dba6e12d2b0fb4350d8a321d49f12ac494
  domain: devic.es
  count: 128                    # pods on a node that may hold each device at once
  nodeSelector: {}
  tolerations:
    - {operator: Exists, effect: NoSchedule}
    - {operator: Exists, effect: NoExecute}

worker:
  enabled: true
  replicas: 2
  slots: 2
  runMemoryGiB: 4
  # virtual presents each run's commit through okfs (docs/okfs.md, "ok's roles"): files are read
  # as the build reads them, never written out. It needs user namespaces and /dev/fuse, which the
  # chart's device plugin offers (devicePlugin); with one of your own, name the resource it offers
  # in fuseResource. Without either, /dev/fuse is bound in from the node, which works only where
  # the runtime applies no device allowlist (an unprivileged LXC node's). real writes every file of
  # each commit to disk: only for a legacy use that needs a commit's whole source on disk.
  checkout: virtual
  fuseResource: ""
  # The pool of workers they serve (docs/hosted.md, "Hosted automation, as built"): jobs name it
  # with pool:, in a workflow job or .ok/repository.yaml.
  pool: default
  # ok automation sizes the workers to their pool's runs — running, and queued of accounts under
  # their quotas — between min and max (replicas is then only where they start), and may scale
  # their Deployment and mark its pods (docs/hosted.md, "Hosted automation, as built").
  autoscale:
    enabled: false
    min: 1
    max: 10
  # Each run in a microVM of its own: Cloud Hypervisor on KVM, with the kernel the runner image
  # carries. The node offers /dev/kvm through the chart's device plugin (devicePlugin), or one of
  # your own whose resource kvmResource names, else it is bound in from the node. egress unset is
  # ok's default list of where Bazel downloads from (docs/configuration.md, worker.microvm.egress).
  microvm:
    enabled: false
    kvmResource: ""
    egress: null
    pushEgress: []
  bazelFlags: []                # every Bazel command's: --remote_cache=…, --disk_cache=…
  # A Secret holding config.json with the registry credentials pushes use (DOCKER_CONFIG).
  dockerConfigSecret: ""
  state: {sizeLimit: 100Gi}     # an emptyDir: its checkouts, Bazel's output bases, kept graphs
  resources: {}
  # Workers make user namespaces and mount in them (bubblewrap, and okfs): seccomp and AppArmor
  # profiles that allow it — the container runtime's defaults refuse both. On nodes that restrict
  # user namespaces through AppArmor (Ubuntu 23.10 and later), give appArmorProfile: {type:
  # Localhost, localhostProfile: ok-sandbox} instead, the profile in deploy/apparmor loaded on
  # each node (docs/install.md, "Workers' nodes").
  securityContext:
    seccompProfile: {type: Unconfined}
    appArmorProfile: {type: Unconfined}
    allowPrivilegeEscalation: false
  nodeSelector: {}
  tolerations: []
  affinity: {}

# ok secrets (docs/secrets.md): repositories' secrets, sealed under keys of each repository's own,
# in a Deployment of its own as the robot secrets.ok. Its root wraps every repository's key: a key
# management service's key (root), which its ServiceAccount reaches by workload identity, or else
# a keyring file in a Secret (ok secrets keyring -id ID > keyring; kubectl create secret generic
# ok-secrets-keyring --from-file=keyring).
secrets:
  enabled: false
  replicas: 2
  root: ""                      # gcp-kms:projects/…/cryptoKeys/…, aws-kms:arn:aws:kms:…; empty: the keyring
  keyringSecret: {name: "", key: keyring}
  # Its own database credential, apart from the other roles' (PostgreSQL; its tables in the schema
  # secrets): {name, key} of a Secret holding the URL. Empty: the installation's.
  databaseSecret: {name: "", key: url}
  # External stores a repository's settings may name (secrets: {store: NAME}), as the
  # configuration's secrets.stores: each reached as this ServiceAccount — Vault by its Kubernetes
  # auth method, AWS and Google by workload identity (serviceAccountAnnotations). For example:
  #   vault: {kind: vault, address: "https://vault.internal:8200", mount: ok, role: ok-secrets}
  #   aws: {kind: aws-secrets-manager, region: us-east-1}
  #   gcp: {kind: gcp-secret-manager, project: acme-secrets}
  stores: {}
  serviceAccountAnnotations: {}
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

deploy:
  enabled: false
  checkout: virtual             # as a worker's: planning and migrations read what they need
  fuseResource: ""              # as a worker's
  bazelFlags: []
  # What the migrations it runs get: {NAME: {secretName, key}}, mounted and read as files.
  migrationEnv: {}
  # Its ServiceAccount's, as the server's: where the installation's database or buckets are reached
  # by workload identity (Spanner's always are), the deployer reaches its own the same way.
  serviceAccountAnnotations: {}
  state: {sizeLimit: 50Gi}
  resources: {}
  # As a worker's: a virtual checkout makes user namespaces and mounts in them.
  securityContext:
    seccompProfile: {type: Unconfined}
    appArmorProfile: {type: Unconfined}
    allowPrivilegeEscalation: false
  # The workloads it rolls, each granted it in its namespace (docs/deploy.md, "Grants"):
  # [{namespace, deployment | statefulset, accounts: [the ServiceAccounts its pods run as]}].
  grants: []
  # Holds the deployer to its grants: it creates only -green copies, runs pods only as accounts a
  # grant names, never changes an account, and adds no host access.
  admissionPolicy:
    enabled: false
