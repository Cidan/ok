# ok secrets on staging (README.md), over values.yaml: repositories' keys wrapped by a Cloud KMS key
# (SECRETS_ROOT, Terraform's secrets_root), their values in ok secrets' own database, or in Secret
# Manager where a repository's settings say so (secrets: {store: gcp}) — reached as ok secrets' own
# Google service account, through workload identity. PROJECT as values.yaml's.
secrets:
  enabled: true
  root: gcp-kms:SECRETS_ROOT
  stores:
    gcp: {kind: gcp-secret-manager, project: PROJECT}
  serviceAccountAnnotations: {iam.gke.io/gcp-service-account: ok-staging-secrets@PROJECT.iam.gserviceaccount.com}
