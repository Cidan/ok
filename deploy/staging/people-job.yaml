# ok load as many people at once (README.md): PODS pods of an indexed Job, each signing its share of
# PEOPLE in — through ok's device sign-in, approved at Dex with the password in ok-load-password —
# and acting as them, each on a connection of their own, in REPOSITORIES repositories (prefix
# PREFIX), at SPEED times the target's rates a person, for DURATION; its synthetic workers as
# worker.ok. Each pod's report is a line of its log, which ok load merge reads. PROJECT and TAG as
# values.yaml's.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ok-load
  namespace: ok
automountServiceAccountToken: false
---
apiVersion: batch/v1
kind: Job
metadata:
  name: ok-people
  namespace: ok
spec:
  completionMode: Indexed
  completions: PODS
  parallelism: PODS
  backoffLimit: 0
  template:
    spec:
      serviceAccountName: ok-load
      restartPolicy: Never
      securityContext: {runAsUser: 65532, runAsGroup: 65532, fsGroup: 65532, runAsNonRoot: true}
      containers:
        - name: load
          image: us-central1-docker.pkg.dev/PROJECT/ok/ok:TAG
          env:
            - {name: OK_PLAINTEXT, value: "1"} # the cluster's network, which the installation trusts
          args: [load, run, -address, "ok-server.ok.svc:8472", -insecure,
                 -server, "http://ok-server.ok.svc:8472", -people, "PEOPLE", -pods, "PODS",
                 -password-file, /etc/ok/load/password/password, -worker-token-file, /var/run/secrets/ok/token/token,
                 -repositories, "REPOSITORIES", -prefix, PREFIX, -speed, "SPEED", -duration, DURATION, -drain, 10m,
                 -workers, "16", -run-time, 10s, -report, "-"]
          resources:
            requests: {cpu: "2", memory: 4Gi}
          volumeMounts:
            - {name: password, mountPath: /etc/ok/load/password}
            - {name: token, mountPath: /var/run/secrets/ok/token, readOnly: true}
      volumes:
        - name: password
          secret: {secretName: ok-load-password, defaultMode: 0440}
        - name: token
          projected:
            sources:
              - serviceAccountToken: {audience: ok, expirationSeconds: 3600, path: token}
