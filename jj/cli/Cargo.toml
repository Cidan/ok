# The virtual scenarios enter a user and mount namespace of their own first thing in main, which
# only a single-threaded process may: they have a harness of their own (okfs_fuse::testns::run).
[[test]]
name = "cli_virtual"
path = "tests/cli_virtual.rs"
harness = false
