[package]
name = "okfs-fuse"
description = "A FUSE file system server, in Rust, over /dev/fuse"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
path = "lib.rs"

[dependencies]
libc.workspace = true

[dev-dependencies]
tempfile.workspace = true

# The kernel test enters a user and mount namespace of its own first thing in main, which only a
# single-threaded process may: it has a harness of its own (testns::run).
[[test]]
name = "kernel"
path = "tests/kernel.rs"
harness = false
