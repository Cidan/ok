[workspace]
resolver = "3"
members = [
    "jj/cl",
    "jj/cli",
    "jj/credential",
    "jj/encoding",
    "jj/okfs",
    "jj/okfs/fuse",
    "jj/proto",
    "jj/review",
    "jj/store",
    "jj/testscm",
    "jj/workingcopy",
]

[workspace.package]
version = "1.0.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/Cidan/ok"

[workspace.dependencies]
# jj is pinned exactly: the canonical encoding (docs/scm.md, "Objects and identity") mirrors this
# release's stored structs field for field, so an upgrade is a deliberate re-check of them. Its
# git and watchman features are off: ok has no git.
jj-lib = { version = "=0.45.1", default-features = false }
jj-cli = { version = "=0.45.1", default-features = false }

ok-cl = { path = "jj/cl" }
ok-credential = { path = "jj/credential" }
ok-encoding = { path = "jj/encoding" }
ok-proto = { path = "jj/proto" }
ok-review = { path = "jj/review" }
ok-store = { path = "jj/store" }
ok-testscm = { path = "jj/testscm" }
ok-working-copy = { path = "jj/workingcopy" }
okfs = { path = "jj/okfs" }
okfs-fuse = { path = "jj/okfs/fuse" }

async-trait = "0.1.92"
base64 = "0.22"
blake3 = "1.8.7"
bytes = "1.12.1"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive", "string", "wrap_help"] }
dunce = "1.0.5"
# Content-defined chunking of large files (docs/scm.md, "The client"): FastCDC 2020, 16/64/256 KiB.
fastcdc = { version = "3.2.1", features = ["futures"] }
futures = "0.3.34"
globset = "0.4.20"
hex = "0.4.3"
http = "1.5.0"
http-body = "1.1.0"
http-body-util = "0.1.5"
libc = { version = "0.2.189", features = ["extra_traits"] }
memmap2 = "0.9.11"
mimalloc = "0.1.52"
# The device credential's key: ECDSA P-256, as ok identity certifies.
p256 = { version = "0.13.2", features = ["ecdsa", "pem", "pkcs8"] }
prost = "0.14.4"
prost-types = "0.14.4"
protox = "0.9.1"
rand_core = { version = "0.6.4", features = ["getrandom"] }
rayon = "1.12.0"
# zstd decoding, pure Rust: the SCM sends chunks as it stores them; its frame checksums are off,
# redundant beside BLAKE3 IDs.
ruzstd = { version = "0.9.0", default-features = false, features = ["std"] }
rustls = { version = "0.23.45", default-features = false, features = ["aws_lc_rs", "logging", "prefer-post-quantum", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = "1.0.151"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["fs", "io-util", "macros", "net", "process", "rt", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = "0.1.19"
toml = "1.1.6"
tonic = { version = "0.14.6", default-features = false, features = ["channel", "codegen", "tls-aws-lc", "tls-native-roots"] }
tonic-prost = "0.14.6"
tonic-prost-build = "0.14.6"
tower = { version = "0.5.3", features = ["util"] }
tower-service = "0.3.3"
x509-cert = "0.2.5"

[profile.release]
lto = "thin"
codegen-units = 4
