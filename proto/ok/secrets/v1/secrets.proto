syntax = "proto3";

// ok secrets (docs/secrets.md): the role that holds every version of every repository's secrets,
// sealed under keys of each repository's own, and decides who reads and writes them from the
// folders' acl.yaml on main.
package ok.secrets.v1;

option go_package = "github.com/Cidan/ok/proto/ok/secrets/v1;secretspb";

import "google/protobuf/timestamp.proto";
import "proto/ok/v1/annotations.proto";

// Secrets is people's, from their workspaces and jj, each request for the person who made it with
// their device credential. Who may read and write a path is its folder's acl.yaml on main's head;
// a read also uses one of the person's unseals of the path.
service Secrets {
  option (ok.v1.callers) = CALLER_PEOPLE;
  // CheckAccess says whether the caller may read and write a path's folder's secrets, whether
  // reading needs a passkey, and whether the repository keeps secrets at all.
  rpc CheckAccess(CheckAccessRequest) returns (CheckAccessResponse);
  // WriteSecret keeps a value as a new version at a path, and returns its pointer.
  rpc WriteSecret(WriteSecretRequest) returns (WriteSecretResponse);
  // ReadSecret reads a version: its value and opening, using one of the caller's unseals of its
  // path.
  rpc ReadSecret(ReadSecretRequest) returns (ReadSecretResponse);
  // Unseal lets the caller read each path once, for ten minutes: at once, or — where a folder
  // asks for a passkey — once they approve with one, which a second call, naming the approval,
  // waits on.
  rpc Unseal(UnsealRequest) returns (UnsealResponse);
  // ListUnseals are the caller's unused, unexpired unseals in a repository.
  rpc ListUnseals(ListUnsealsRequest) returns (ListUnsealsResponse);
}

message CheckAccessRequest {
  int64 repository_id = 1;
  // A secret's path, secret/prod/db-password, for its folder; or secret, the tree's root.
  string path = 2;
}

message CheckAccessResponse {
  // keeps_secrets: the repository's settings on main have a secrets stanza; without it //secret is
  // an ordinary folder, and nothing else here applies.
  bool keeps_secrets = 1;
  bool read = 2;
  bool write = 3;
  // passkey: the folder's acl.yaml asks for a passkey to unseal its secrets.
  bool passkey = 4;
  // Why the caller may not read, or write, when they may not.
  string why_not_read = 5;
  string why_not_write = 6;
}

message WriteSecretRequest {
  int64 repository_id = 1;
  string path = 2;
  bytes value = 3;  // at most 1 MiB
}

message WriteSecretResponse {
  bytes digest = 1;
  bytes opening = 2;
  bytes pointer = 3;  // the line the path holds in the repository: ok-secret v1 blake3:<hex>\n
}

message ReadSecretRequest {
  int64 repository_id = 1;
  string path = 2;
  bytes digest = 3;  // the pointer's
}

message ReadSecretResponse {
  bytes value = 1;
  bytes opening = 2;  // so the reader checks the value against the pointer it holds
}

message UnsealRequest {
  int64 repository_id = 1;
  repeated string paths = 2;
  // approval_id names an approval the first call started, to wait on: the same paths again.
  string approval_id = 3;
}

message UnsealResponse {
  enum State {
    STATE_UNSPECIFIED = 0;
    // GRANTED: each path is unsealed, for one read each.
    STATE_GRANTED = 1;
    // APPROVE: the person approves at url, with a passkey; call again with approval_id.
    STATE_APPROVE = 2;
    // WAITING: the approval is not given yet; call again.
    STATE_WAITING = 3;
  }
  State state = 1;
  string approval_id = 2;
  string url = 3;
  google.protobuf.Timestamp expires_at = 4;  // the unseals', once granted; the approval's, before
}

message ListUnsealsRequest {
  int64 repository_id = 1;
}

message ListUnsealsResponse {
  repeated Unseal unseals = 1;
}

message Unseal {
  string path = 1;
  google.protobuf.Timestamp expires_at = 2;
}

// DeploySecrets is the deployer's: the secrets a deploy's migrations read, for a deployment of a
// commit on main (docs/secrets.md, "Readers that are not people").
service DeploySecrets {
  option (ok.v1.callers) = CALLER_DEPLOY;
  // ReadDeploySecret reads the version a commit of main holds at a path, for a deploy whose stanza
  // at that commit names it and whose folder's acl.yaml on main lists the deploy.
  rpc ReadDeploySecret(ReadDeploySecretRequest) returns (ReadSecretResponse);
}

message ReadDeploySecretRequest {
  int64 repository_id = 1;
  bytes commit_id = 2;
  string deploy = 3;  // the deploy's identity: //<dir>/.ok/workflow/<file>.yaml:deploy:<name>
  string path = 4;
}

// RunSecrets is workers': the secrets a post job reads as it runs.
service RunSecrets {
  option (ok.v1.callers) = CALLER_WORKER;
  // ReadRunSecret reads the version a post run's commit holds at a path, for the worker that holds
  // the run's lease — proven by the key ok automation gave it with the lease — when the job's
  // stanza at that commit names the secret and its folder's acl.yaml on main lists the job.
  rpc ReadRunSecret(ReadRunSecretRequest) returns (ReadSecretResponse);
}

message ReadRunSecretRequest {
  int64 repository_id = 1;
  int64 run_id = 2;
  string path = 3;
  bytes run_key = 4;  // the lease's (ok.automation.v1.LeaseResponse.run_key)
}

// Versions is the SCM's: what only ok secrets knows, which an upload's checks need.
service Versions {
  option (ok.v1.callers) = CALLER_SCM;
  // CheckPointers says of each pointer whether ok secrets keeps its version at its path.
  rpc CheckPointers(CheckPointersRequest) returns (CheckPointersResponse);
  // CheckWriters says of each folder whether a principal may write its secrets, as main says.
  rpc CheckWriters(CheckWritersRequest) returns (CheckWritersResponse);
}

message Pointer {
  string path = 1;
  bytes digest = 2;
}

message CheckPointersRequest {
  int64 repository_id = 1;
  repeated Pointer pointers = 2;
}

message CheckPointersResponse {
  repeated bool kept = 1;  // in the request's order
}

message CheckWritersRequest {
  int64 repository_id = 1;
  string principal_id = 2;
  repeated string folders = 3;  // secret, secret/prod
}

message CheckWritersResponse {
  repeated bool writer = 1;  // in the request's order
}
