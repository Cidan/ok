syntax = "proto3";

// ok's deployer (docs/deploy.md): after a commit lands on main, it runs the migrations it changed,
// has ok automation's workers push the images it changed, and rolls each affected long-lived
// service in watched stages, in waves, rolling back what fails.
package ok.deploy.v1;

option go_package = "github.com/Cidan/ok/proto/ok/deploy/v1;deploypb";

import "google/protobuf/timestamp.proto";
import "proto/ok/v1/annotations.proto";

// Deployments serves ok control and the deployer's administrators. ok control acts on
// behalf of a person it has authorized, and names them by stable ID (for_person_id); an
// administrator acts as itself. Principals are named by stable ID throughout (docs/hosted.md,
// "Tenancy, as built").
service Deployments {
  // Only ok control, acting for the people it authorized.
  option (ok.v1.callers) = CALLER_CONTROL;
  // ListDeployments lists a repository's deployments, newest first: those that cover a commit
  // of main (a CL's landed commit), or the latest.
  rpc ListDeployments(ListDeploymentsRequest) returns (ListDeploymentsResponse);
  // GetDeployment reads one deployment, with its log.
  rpc GetDeployment(GetDeploymentRequest) returns (Deployment);
  // RetryDeployment runs a deployment that failed, was halted, or was canceled again, at its
  // commit, as a new deployment. It must be its deploy's latest.
  rpc RetryDeployment(RetryDeploymentRequest) returns (Deployment);
  // HaltDeployment stops a deployment: one waiting is canceled at once, one running rolls back.
  rpc HaltDeployment(HaltDeploymentRequest) returns (Deployment);
  // AllowHazards allows the gated hazards a deployment's migration refused, and it applies the
  // migration again with them.
  rpc AllowHazards(AllowHazardsRequest) returns (Deployment);
  // ListServices lists the services — deploys that roll a workload — by repository and name,
  // each with what ok deployed and what runs in the cluster.
  rpc ListServices(ListServicesRequest) returns (ListServicesResponse);
  // GetService reads one service, with its recent deployments.
  rpc GetService(GetServiceRequest) returns (Service);
}

message ListServicesRequest {
  int64 repository_id = 1;  // 0: every repository's
}

message ListServicesResponse {
  repeated Service services = 1;
}

message GetServiceRequest {
  int64 id = 1;
  int32 recent = 2;  // how many recent deployments; 0: 20, at most 200
}

// A service: a deploy that rolls a workload.
message Service {
  int64 id = 1;
  int64 repository_id = 2;
  string repository = 3;  // its name
  string deploy = 4;      // //<file>:deploy:<name>
  string name = 5;
  Workload workload = 6;
  bool declared = 7;        // main's latest plan of its repository declares it
  Deployment deployed = 8;  // the latest deployment that succeeded: what ok deployed; unset: none
  Deployment latest = 9;    // the latest deployment, whatever its status; unset: none
  Running running = 10;     // the workload as the cluster runs it, as the deployer last read it
  repeated Deployment recent = 11;  // GetService only: its latest deployments, newest first
  // Its group on the Services pages (docs/deploy.md, "Services"), as main last declared
  // it: one namespace across repositories, by name. "": a group of its own.
  string group = 12;
}

// A workload as the cluster runs it, as the deployer's observer last read it (every ten seconds).
message Running {
  bool found = 1;      // the workload exists
  string error = 2;    // the cluster could not be read
  string live = 3;     // a Deployment's live copy: blue or green; "" for a StatefulSet
  int32 replicas = 4;  // the live copy's wanted replicas
  int32 ready = 5;     // its pods that are Ready and run its template's images
  repeated ContainerImage images = 6;  // the live copy's template, by container
  repeated Pod pods = 7;
  reserved 8;
  reserved "observed_at";
}

message ContainerImage {
  string container = 1;
  string image = 2;
}

// A pod of a workload.
message Pod {
  string name = 1;
  string copy = 2;  // blue or green; "" for a StatefulSet's
  bool ready = 3;
  int32 restarts = 4;
  string phase = 5;
  string reason = 6;  // why it is not running: a waiting container's reason, or its failure
  // What each container runs: the image digest the node pulled, once it has.
  repeated ContainerImage images = 7;
  google.protobuf.Timestamp started = 8;
  bool terminating = 9;
}

message ListDeploymentsRequest {
  int64 repository_id = 1;
  bytes commit_id = 2;  // those covering this commit; empty: the latest
  int32 limit = 3;      // 0: 50; at most 500
}

message ListDeploymentsResponse {
  repeated Deployment deployments = 1;
  // With a commit: a plan has reached it, so every deployment of it has been made (those that
  // cover it are all there is). Before, its deployments are yet to be planned.
  bool planned = 2;
}

message GetDeploymentRequest {
  int64 id = 1;
}

message RetryDeploymentRequest {
  int64 id = 1;
  string for_person_id = 3;  // ok control only
  reserved 2;
  reserved "for_person";
}

message HaltDeploymentRequest {
  int64 id = 1;
  string for_person_id = 3;
  reserved 2;
  reserved "for_person";
}

message AllowHazardsRequest {
  int64 id = 1;
  string for_person_id = 3;
  reserved 2;
  reserved "for_person";
}

// A deployment: one deploy, at one commit of main.
message Deployment {
  enum Status {
    STATUS_UNSPECIFIED = 0;
    STATUS_WAITING = 1;  // for its turn: its wave, or another deployment of its deploy
    STATUS_RUNNING = 2;
    STATUS_SUCCEEDED = 3;
    STATUS_FAILED = 4;
    STATUS_HALTED = 5;    // stopped and rolled back: by a person, or because its plan failed
    STATUS_CANCELED = 6;  // never ran: replaced by a newer commit's, or its plan failed first
  }
  enum Stage {
    STAGE_UNSPECIFIED = 0;
    STAGE_QUEUED = 1;
    STAGE_PUSH = 2;
    STAGE_MIGRATE = 3;
    STAGE_HAZARD = 4;  // a migration waits for a repository admin to allow its hazards
    STAGE_ROLL = 5;
    STAGE_DONE = 6;
  }
  int64 id = 1;
  int64 repository_id = 2;
  int64 plan_id = 3;  // 0: a retry
  int64 retry_of = 4;
  string deploy = 5;  // //<file>:deploy:<name>
  string name = 6;
  bytes commit_id = 7;
  // It covers main's commits after from_seq, up to to_seq.
  int64 from_seq = 8;
  int64 to_seq = 9;
  string why = 10;
  int32 wave = 11;
  Workload workload = 13;  // unset for a deploy that only migrates
  Status status = 14;
  Stage stage = 15;
  string reason = 16;
  bool self = 17;  // it deploys the deployer
  google.protobuf.Timestamp created_at = 19;
  google.protobuf.Timestamp started_at = 20;
  google.protobuf.Timestamp finished_at = 21;
  repeated Image images = 22;
  repeated Migration migrations = 23;
  Roll roll = 24;              // unset until it rolls
  repeated Event events = 25;  // GetDeployment only
  string requested_by_id = 26;
  string halt_by_id = 27;  // who asked it to halt
  string halt_reason =
      28;  // why ok asked it to halt, itself: another deployment of its plan failed
  reserved 12, 18;
  reserved "requested_by", "halt_by";
}

message Workload {
  string namespace = 1;
  string kind = 2;  // deployment or statefulset
  string name = 3;
}

// A container a deployment rolls.
message Image {
  string container = 1;
  string target = 2;     // the oci_push
  int64 push_run = 3;    // ok automation's run that pushes it; 0 until it starts
  string reference = 4;  // registry/repository@sha256:… once pushed
}

// A migration a deployment applies.
message Migration {
  enum Status {
    STATUS_UNSPECIFIED = 0;
    STATUS_PENDING = 1;
    STATUS_APPLIED = 2;
    STATUS_WAITING = 3;  // for an allowance of its refused hazards
    STATUS_FAILED = 4;
  }
  string target = 1;
  Status status = 2;
  string output = 3;       // what the migration printed
  MigrationPlan plan = 4;  // its plan, as the migrate protocol reports it
  repeated string refused = 5;
  repeated string allowed = 6;
  string allowed_by_id = 8;
  reserved 7;
  reserved "allowed_by";
}

// A migration's plan: what a target speaking the migrate protocol prints when run with `plan`
// (docs/deploy.md, "Migrations").
message MigrationPlan {
  message Hazard {
    string class = 1;
    string detail = 2;
    bool gated = 3;
  }
  message Step {
    string description = 1;
    string sql = 2;
    repeated Hazard hazards = 3;
  }
  string database = 1;
  string server = 2;
  repeated Step steps = 3;
  bool executed = 4;
  string error = 5;
}

// Where a deployment's roll is.
message Roll {
  string stage = 1;    // prepare, canary, full, rollback, done
  string outcome = 2;  // unchanged, rolled, rolled back, stuck
  string reason = 3;
  string live = 4;  // a Deployment's copy that was live: blue or green
  string new = 5;   // and the one that rolls
  int32 replicas = 6;
  google.protobuf.Timestamp stage_started = 7;
}

message Event {
  google.protobuf.Timestamp at = 1;
  string message = 2;
}

// ─── Agents (docs/hosted.md, "Deploy agents, as built") ───

// Agents is where an organization's deploy agent, running in its cluster, connects to a cell's
// deployer, out from the cluster: the agent says who it is (AgentHello), the deployer welcomes it
// (AgentWelcome), then sends it requests — its cluster's API, and migrations — which it answers,
// many at once, each by its ID. Only the robot its organization designated connects.
service Agents {
  option (ok.v1.callers) = CALLER_ROBOTS;
  rpc Connect(stream AgentUp) returns (stream AgentDown);
}

// AgentRelay carries a replica's requests to the agent whose connection another replica holds:
// the first message names the account, and each after it carries a request's frame.
service AgentRelay {
  option (ok.v1.callers) = CALLER_DEPLOY;
  rpc Exchange(stream RelayDown) returns (stream AgentUp);
}

// AgentUp is what an agent sends.
message AgentUp {
  oneof kind {
    AgentHello hello = 1;
    KubeResponseFrame kube = 2;
    MigrationResult migration = 3;
  }
}

// AgentDown is what a deployer sends an agent.
message AgentDown {
  oneof kind {
    AgentWelcome welcome = 1;
    KubeRequestFrame kube = 2;
    MigrationRequest migration = 3;
    // cancel ends a request the deployer no longer waits on.
    int64 cancel = 4;
  }
}

message AgentHello {
  string version = 1;  // the agent's ok version
}

message AgentWelcome {
  string account_id = 1;  // the organization it is the agent of
  string cell = 2;        // the deployer's cell
}

message RelayDown {
  string account_id = 1;  // the first message's alone
  AgentDown down = 2;
}

message Header {
  string name = 1;
  repeated string values = 2;
}

// KubeRequestFrame is a piece of a request to the cluster's API server: its first frame carries
// its method, path and query, and headers; every frame a piece of its body; its last sets end.
message KubeRequestFrame {
  int64 id = 1;
  string method = 2;
  string url = 3;  // the path and query: /apis/apps/v1/namespaces/web/deployments/api?timeout=30s
  repeated Header headers = 4;
  bytes body = 5;
  bool end = 6;
}

// KubeResponseFrame is a piece of the answer: its first frame carries its status and headers,
// every frame a piece of its body, its last sets end — or error, when the agent could not ask or
// refused to (status 0).
message KubeResponseFrame {
  int64 id = 1;
  int32 status = 2;
  repeated Header headers = 3;
  bytes body = 4;
  bool end = 5;
  string error = 6;
}

// MigrationRequest asks an agent to run a deployment's migration in its cluster: the target at a
// commit of a repository of its organization's, allowing the gated hazard classes allow.
message MigrationRequest {
  int64 id = 1;
  int64 repository_id = 2;
  bytes commit_id = 3;
  string target = 4;
  repeated string allow = 5;
  // The secrets the deploy's stanza names, which ok secrets gave the deployer for this commit of
  // main (docs/secrets.md, "Readers that are not people"): the agent writes them on a memory file
  // system for the migration alone, and redacts them from what it reports.
  repeated SecretValue secrets = 6;
}

message SecretValue {
  string path = 1;  // secret/prod/db-password
  bytes value = 2;
}

// MigrationResult is what the migration did: its report (ok's migrate protocol, JSON), the
// classes it refused, everything it printed, and why it failed; or error, when the agent could not
// run it — worth asking again.
message MigrationResult {
  int64 id = 1;
  bytes report = 2;
  repeated string refused = 3;
  string output = 4;
  string failed = 5;
  string error = 6;
}
